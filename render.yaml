databases:
  - name: coopx-db
    plan: free
    databaseName: coopx
    user: coopx

services:
  # ── Django REST API ──────────────────────────────────────────────────────
  - type: web
    name: coopx-backend
    runtime: python
    plan: free
    rootDir: .
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn coopsys.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      # scikit-learn==1.3.2 has no prebuilt wheel for very new Python
      # versions (Render defaults to the latest available) — pin to one it
      # definitely has wheels for so the build doesn't fall back to
      # compiling Cython from source (which fails).
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: coopx-db
          property: connectionString
      # Render only exposes the bare hostname here (no "https://" scheme) —
      # settings.py/client.ts prepend it if missing.
      - key: FRONTEND_URL
        fromService:
          type: web
          name: coopx-frontend
          property: host
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: coopx-frontend
          property: host
      - key: GOOGLE_OAUTH_CLIENT_ID
        value: ""
      - key: PAYSTACK_SECRET_KEY
        value: ""
      - key: PAYSTACK_PUBLIC_KEY
        value: ""
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.console.EmailBackend"

  # ── React (TanStack Start) frontend ──────────────────────────────────────
  - type: web
    name: coopx-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    startCommand: "node .output/server/index.mjs"
    envVars:
      # Bare hostname only (Render has no property with a scheme) —
      # client.ts prepends "https://" and appends "/api" if missing.
      - key: VITE_API_URL
        fromService:
          type: web
          name: coopx-backend
          property: host
      - key: VITE_GOOGLE_CLIENT_ID
        value: ""
