databases:
  - name: coopx-db
    plan: free
    databaseName: coopx
    user: coopx

services:
  # ── Django REST API ──────────────────────────────────────────────────────
  - type: web
    name: coopx-backend
    runtime: python
    plan: free
    rootDir: .
    # setup_coopsys seeds the demo admin/members and is idempotent (checks
    # `.exists()` before creating anything) — safe to run on every deploy,
    # and means a fresh Postgres instance always ends up with a working
    # admin@coopsys.ng / admin123 login without needing dashboard shell
    # access (which isn't available on Render's free plan).
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py setup_coopsys --skip-ml"
    startCommand: "gunicorn coopsys.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      # scikit-learn==1.3.2 has no prebuilt wheel for very new Python
      # versions (Render defaults to the latest available) — pin to one it
      # definitely has wheels for so the build doesn't fall back to
      # compiling Cython from source (which fails).
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: coopx-db
          property: connectionString
      # Render's fromService {property: host} only returns the INTERNAL
      # service name (e.g. "coopx-frontend"), used for Render's private
      # network between services — not the public https://...onrender.com
      # address a browser actually needs for CORS/redirect URLs. There's no
      # Blueprint property that exposes the public URL, so these must be set
      # by hand in the dashboard once you know the frontend's real URL
      # (Environment tab → edit these two → Save; no rebuild needed, these
      # are read at request time).
      - key: FRONTEND_URL
        value: ""
      - key: CORS_ALLOWED_ORIGINS
        value: ""
      - key: GOOGLE_OAUTH_CLIENT_ID
        value: ""
      - key: PAYSTACK_SECRET_KEY
        value: ""
      - key: PAYSTACK_PUBLIC_KEY
        value: ""
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.console.EmailBackend"

  # ── React (TanStack Start) frontend ──────────────────────────────────────
  - type: web
    name: coopx-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    startCommand: "node .output/server/index.mjs"
    envVars:
      # Same limitation as FRONTEND_URL on the backend service: Render's
      # fromService can only give the internal service name here, not the
      # public URL a browser can actually resolve. Set this by hand in the
      # dashboard to the backend's real https://...onrender.com URL once
      # you know it, then trigger a manual redeploy of THIS service — Vite
      # bakes VITE_* vars in at build time, so just changing the env var
      # without rebuilding won't take effect.
      - key: VITE_API_URL
        value: ""
      - key: VITE_GOOGLE_CLIENT_ID
        value: ""
