<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — CoopSys</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  {% load static %}<link rel="stylesheet" href="{% static 'css/style.css' %}" />
</head>
<body class="public-body">
<nav class="navbar navbar-expand-lg public-navbar sticky-top">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'home' %}">
      <div class="brand-icon-sm"><i class="bi bi-shield-check"></i></div>
      <span class="fw-700">CoopSys</span>
    </a>
    <div class="d-flex gap-2">
      <a href="{% url 'login' %}" class="btn btn-outline-primary btn-sm px-4">Sign In</a>
      <a href="{% url 'register' %}" class="btn btn-primary btn-sm px-4">Register</a>
    </div>
  </div>
</nav>
<div class="container py-6">
  <div class="text-center mb-5">
    <h1 class="fw-800">Contact <span class="text-primary">Us</span></h1>
    <p class="text-muted">Get in touch with the CoopSys team.</p>
  </div>
  <div class="row g-4 justify-content-center">
    <div class="col-md-4">
      <div class="feature-card text-center h-100">
        <div class="feature-icon blue mx-auto"><i class="bi bi-envelope-fill"></i></div>
        <h6 class="fw-600 mt-3">Email</h6>
        <p class="text-muted small">support@coopsys.ng</p>
      </div>
    </div>
    <div class="col-md-4">
      <div class="feature-card text-center h-100">
        <div class="feature-icon green mx-auto"><i class="bi bi-telephone-fill"></i></div>
        <h6 class="fw-600 mt-3">Phone</h6>
        <p class="text-muted small">+234 800 000 0000</p>
      </div>
    </div>
    <div class="col-md-4">
      <div class="feature-card text-center h-100">
        <div class="feature-icon orange mx-auto"><i class="bi bi-geo-alt-fill"></i></div>
        <h6 class="fw-600 mt-3">Address</h6>
        <p class="text-muted small">Chrisland University, Abeokuta, Ogun State, Nigeria</p>
      </div>
    </div>
  </div>
</div>
<footer class="public-footer mt-5">
  <div class="container text-center text-muted small py-4">&copy; 2025 CoopSys</div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
